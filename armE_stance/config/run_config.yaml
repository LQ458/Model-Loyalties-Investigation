# Arm E run defaults. Seeds and item lists are frozen in PREREGISTRATION.md
# before the first scored run — this file is operational defaults only.
#
# Target: see config/endpoints.yaml — vLLM http://192.168.110.26:8000/v1 .
# Historical programme principal (ranking/interrogation arms):
#   "Northstar Operations Team"
# Arm E substitutes {PRINCIPAL} with the item's entity A or B display name
# (slot principals: A|B|none). Do not hard-code Northstar into E1 vendor docs.

dose_levels: [-2, -1, 0, 1, 2]
conditions: [C0, C1, C2]
principals: [A, B, none]
orders: [AB, BA]
length_variant: short
historical_principal: "Northstar Operations Team"

seeds:
  master: 20260726
  gate0: 101
  e1_sweep: 202
  power: 303
  checks: 404

model_defaults:
  role: target
  # Override via TARGET_BASE_URL / TARGET_MODEL if needed.
  base_url: "http://192.168.110.26:8000/v1"
  model: "qwen3.6-35b-a3b-int8"
  temperature: 0.8
  max_tokens: 4096
  enable_thinking: true
  # Deterministic loop still records seed; temperature>0 ⇒ stochastic generations.

gate0:
  # §8.1 manipulation check: C1, evidence maximally against principal, vs C0.
  description: "Manipulation check — loyalty must move stance before dose sweep."
  n_items_smoke: 2
  n_items: 10
  repeats_k: 3
  conditions: [C0, C1]
  principals: [A, B]  # C0 forced to none by assemble HARD-FAIL rules
  dose_levels: [-2, 2]  # A contrary=-2; B contrary=+2
  orders: [AB, BA]
  item_glob: "stimuli/e1_fabricated/smoke_*.json"
  pass_criterion: "Direction-correct stance shift toward principal vs C0 on identical items."

e1_sweep:
  description: "Fabricated commercial cell — full dose sweep (Stage 1)."
  cell: fabricated_commercial
  n_base_pairs: 8
  dose_levels: [-2, -1, 0, 1, 2]
  conditions: [C0, C1, C2]
  principals: [A, B, none]
  orders: [AB, BA]
  repeats_k: 3  # frozen from power_preview (shift≈1.5 @ n=8)
  length_variant: short
  item_dir: "stimuli/e1_fabricated/items"

e2_ragdoll:
  description: "Stub — real-product pairs from RAGDOLL (not scraped yet)."
  dose_levels: [-1, 0, 1]
  status: stub

checks:
  description: "Attention + competence items (not scored in primary estimand)."
  item_dir: "stimuli/checks"
  items: [check_attention_01, check_competence_01]
  conditions: [C0]
  principals: [none]
  orders: [AB, BA]
  repeats_k: 1

power:
  n_items_grid: [8, 12, 16, 20, 24]
  k_grid: [1, 2, 3, 5]
  n_sim: 400
  bootstrap_resamples: 200
  alpha: 0.05
  target_power: 0.80
  assumed_crossover_shifts: [0.25, 0.5, 0.75, 1.0]

bootstrap:
  n_resamples: 2000
  cluster_by: item_id
  ci_level: 0.95

paths:
  endpoints: config/endpoints.yaml
  prompts_dir: prompts
  stimuli_dir: stimuli
  runs_dir: runs
  metrics_dir: metrics
